  - type: turn_on
    device_id: f6e3dbeb1a8b054b06f8b94a7cc5626b
    entity_id: 78905b4f94bca138174c9768ee01bf36
    domain: switch
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - type: turn_off
    device_id: f6e3dbeb1a8b054b06f8b94a7cc5626b
    entity_id: 78905b4f94bca138174c9768ee01bf36
    domain: switch
  mode: single
