      sequence:
      - action: system_log.write
        metadata: {}
        data:
          level: error
          message: Network is OFF (try to recover)
        enabled: false
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.internet_connected
        data: {}
        enabled: false
      - action: shell_command.wifi_reset
        metadata: {}
        data: {}
        enabled: false
      - action: hassio.host_reboot
        metadata: {}
        data: {}
        enabled: false
  mode: single
- id: '1768040171283'
  alias: Network_Info
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions: []
  actions:
  - action: shell_command.wifi_info
    metadata: {}
    data: {}
    response_variable: response
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.wifi_ip_addr
    data:
      value: '{{ (response[''stdout''] | from_json).data.ipv4.address[0].split(''/'')[0]
        }}'
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.wifi_signal
    data:
      value: '{{ (response[''stdout''] | from_json).data.wifi.signal | default(0)
        | int }}'
  - action: shell_command.public_ip_addr
    metadata: {}
    data: {}
    response_variable: response
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.public_ip_addr
    data:
      value: '{{ response[''stdout''] }}'
  mode: single
