- id: '1761835766119'
  alias: detection_porte_terrasse
  description: detection_porte_terrasse
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.ds_terrasse_contact
    from: 'off'
    to: 'on'
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  - condition: and
    conditions:
    - condition: state
      entity_id: switch.lampe_terrasse_l2
      state: 'off'
